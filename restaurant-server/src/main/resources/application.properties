spring.application.name=restaurant-server
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security
security.jwt.secret-key=${SECRET_KEY:dev-secret-key-at-least-32-chars-long!!}

# Mercado Pago (credenciales de prueba)
mercado-pago.base-url=https://api.mercadopago.com
mercado-pago.access-token=${MP_ACCESS_TOKEN:APP_USR-7595381034874467-060913-db4e8ec2e7b4cb804ab754a1fdb27a00-3462667386}
mercado-pago.user-id=${MP_USER_ID:3462667386}
